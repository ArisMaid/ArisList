# Docker Compose 部署配置
#
# 路径规则：
# - volumes 左侧是宿主机/NAS 上的真实路径，右侧是容器内路径。
# - 设置页里填写媒体目录时，应填写右侧的容器内路径，例如 /library/comics。
# - 媒体目录建议保持 :ro 只读；本项目只会写入 /app/data 和 /app/generated。
# - 同一种媒体有多个目录时，不要挂到同一个容器路径，应该挂到不同子目录：
#   例如 /volume1/comics:/library/comics/main:ro
#        /volume2/comics:/library/comics/archive:ro

services:
  app:
    # 默认从镜像仓库拉取，适合 NAS/服务器部署。
    # 如需使用其它镜像或固定版本，可在 .env 中设置：
    # ARISLIST_IMAGE=ghcr.io/arismaid/arislist:v1.0.0
    image: ${ARISLIST_IMAGE:-ghcr.io/arismaid/arislist:latest}
    pull_policy: always

    # 端口映射：左侧是宿主机/NAS 端口，右侧是容器内端口。
    # 访问地址通常是 http://NAS_IP:8787/
    ports:
      - "${APP_PORT:-8787}:8787"

    # 使用独立 init 进程转发信号并回收子进程，避免扫描/转码任务残留。
    init: true

    # N100 NAS 默认把容器硬限制在 4GiB；可在 .env 中覆盖。
    mem_limit: ${APP_MEMORY_LIMIT:-4g}

    # 可选 .env 文件。需要覆盖密码、qmediasync 地址等配置时，优先改 .env。
    env_file:
      - path: .env
        required: false

    environment:
      # APP_BIND is public inside the container, so explicit strong credentials are required.
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (at least 32 random characters) in .env}

      # SQLite 数据库位置，保存索引、历史、阅读进度、设置等应用数据。
      DATABASE_URL: sqlite:///app/data/library.sqlite

      # 容器内监听地址。Docker 部署时应保持 0.0.0.0，方便宿主机端口转发。
      APP_BIND: 0.0.0.0:8787

      # 默认媒体目录。这些都是容器内路径，需要和下方 volumes 右侧路径对应。
      # 如果设置页里已经保存了媒体目录，实际扫描会优先使用设置页中的目录列表。
      COMICS_DIR: /library/comics
      NOVELS_DIR: /library/novels
      AUDIO_DIR: /library/audio
      GALLERY_DIR: /library/gallery
      COSER_PICTURE_DIR: /library/coser-picture

      # 派生文件目录，例如封面、缩略图等生成内容。
      GENERATED_DIR: /app/generated
      COVER_CACHE_DIR: /app/cover-cache
      CLOUD_CACHE_MAX_BYTES: ${CLOUD_CACHE_MAX_BYTES:-68719476736}
      THUMBNAIL_CACHE_MAX_BYTES_PER_DIR: ${THUMBNAIL_CACHE_MAX_BYTES_PER_DIR:-8589934592}
      # Catalog v2 使用服务端分页、筛选和合集，避免浏览器加载全部作品。
      CATALOG_V2_ENABLED: ${CATALOG_V2_ENABLED:-true}
      # Experimental bounded bitmap for cold selective Facets; keep disabled until its N100 Gate passes.
      FACET_BITMAP_ENABLED: ${FACET_BITMAP_ENABLED:-false}
      # Shadow inventory only records bounded discovery state and never mutates works/assets/tags.
      INVENTORY_SCANNER_ENABLED: ${INVENTORY_SCANNER_ENABLED:-false}
      # Gradual rollout subset; use novel first, then add comic/coser-picture/audio/gallery.
      INVENTORY_SCANNER_KINDS: ${INVENTORY_SCANNER_KINDS:-all}
      # Builds and incrementally maintains a separate Tantivy shadow index; production reads stay unchanged.
      SEARCH_OUTBOX_SHADOW_ENABLED: ${SEARCH_OUTBOX_SHADOW_ENABLED:-false}
      # Allows only explicit reader=shadow canary requests after the shadow index is ready.
      SEARCH_SHADOW_CANARY_ENABLED: ${SEARCH_SHADOW_CANARY_ENABLED:-false}
      # Atomic-on-restart production reader cutover; requires shadow + canary workers,
      # a ready/reconciled index, and all ownership Gate checks.
      SEARCH_INCREMENTAL_READER_ENABLED: ${SEARCH_INCREMENTAL_READER_ENABLED:-false}
      # Reader mmap/segment setup before readiness; opt-in until N100 startup/RSS Gate passes.
      SEARCH_READER_PREWARM_ENABLED: ${SEARCH_READER_PREWARM_ENABLED:-false}
      # v2 默认保持关闭，完成 NAS 实机 Gate 后再切换。目录应位于本机 SSD。
      DERIVATIVE_CACHE_V2_ENABLED: ${DERIVATIVE_CACHE_V2_ENABLED:-false}
      # MozJPEG DCT-scaled thumbnails are opt-in until the target NAS Gate passes.
      JPEG_THUMBNAIL_DOWNSCALE_ENABLED: ${JPEG_THUMBNAIL_DOWNSCALE_ENABLED:-false}
      DERIVATIVE_CACHE_DIR: ${DERIVATIVE_CACHE_DIR:-/app/data/derivatives}
      DERIVATIVE_CACHE_MAX_BYTES: ${DERIVATIVE_CACHE_MAX_BYTES:-34359738368}
      DERIVATIVE_CACHE_LOW_WATERMARK_BYTES: ${DERIVATIVE_CACHE_LOW_WATERMARK_BYTES:-30064771072}

      # N100/4GiB 资源治理基线。先使用保守预算，实机基准通过后再上调。
      RESOURCE_PROFILE: ${RESOURCE_PROFILE:-nas-n100-4g}
      # SQLite、WAL 和索引必须位于 /app/data 对应的本机 SSD。
      SQLITE_MAX_CONNECTIONS: ${SQLITE_MAX_CONNECTIONS:-5}
      SQLITE_CACHE_KIB_PER_CONNECTION: ${SQLITE_CACHE_KIB_PER_CONNECTION:-24576}
      SQLITE_MMAP_SIZE_BYTES: ${SQLITE_MMAP_SIZE_BYTES:-67108864}
      SQLITE_BUSY_TIMEOUT_MILLIS: ${SQLITE_BUSY_TIMEOUT_MILLIS:-10000}
      SQLITE_ACQUIRE_TIMEOUT_MILLIS: ${SQLITE_ACQUIRE_TIMEOUT_MILLIS:-10000}
      SQLITE_WAL_AUTOCHECKPOINT_PAGES: ${SQLITE_WAL_AUTOCHECKPOINT_PAGES:-4000}
      SQLITE_JOURNAL_SIZE_LIMIT_BYTES: ${SQLITE_JOURNAL_SIZE_LIMIT_BYTES:-268435456}
      SQLITE_WRITER_QUEUE_MAX_DEPTH: ${SQLITE_WRITER_QUEUE_MAX_DEPTH:-32}
      SQLITE_WRITER_QUEUE_MAX_BYTES: ${SQLITE_WRITER_QUEUE_MAX_BYTES:-67108864}
      PROCESSING_MEMORY_BUDGET_BYTES: ${PROCESSING_MEMORY_BUDGET_BYTES:-1073741824}
      INFLIGHT_MEDIA_BUDGET_BYTES: ${INFLIGHT_MEDIA_BUDGET_BYTES:-268435456}
      MEMORY_SOFT_LIMIT_BYTES: ${MEMORY_SOFT_LIMIT_BYTES:-3221225472}
      MEMORY_RESUME_LIMIT_BYTES: ${MEMORY_RESUME_LIMIT_BYTES:-2818572288}
      ARCHIVE_MANIFEST_CACHE_BYTES: ${ARCHIVE_MANIFEST_CACHE_BYTES:-268435456}
      RESOURCE_WAIT_TIMEOUT_MILLIS: ${RESOURCE_WAIT_TIMEOUT_MILLIS:-10000}
      THUMBNAIL_WORKERS: ${THUMBNAIL_WORKERS:-1}
      ARCHIVE_STREAM_WORKERS: ${ARCHIVE_STREAM_WORKERS:-2}
      LOCAL_MEDIA_STREAM_WORKERS: ${LOCAL_MEDIA_STREAM_WORKERS:-2}
      SCAN_IO_CONCURRENCY: ${SCAN_IO_CONCURRENCY:-1}
      SEARCH_WRITER_HEAP_BYTES: ${SEARCH_WRITER_HEAP_BYTES:-33554432}
      ENRICHMENT_CONCURRENCY: ${ENRICHMENT_CONCURRENCY:-1}

      # qmediasync 服务地址，可在 .env 中设置，例如：
      # QMEDIASYNC_BASE_URL=http://192.168.31.39:8095
      QMEDIASYNC_BASE_URL: ${QMEDIASYNC_BASE_URL:-}

      # NAS/Docker 部署建议关闭文件监听，新增资源后在网页里手动“重新扫描并重建索引”。
      ENABLE_FILE_WATCHER: ${ENABLE_FILE_WATCHER:-false}
      WATCH_DEBOUNCE_SECONDS: ${WATCH_DEBOUNCE_SECONDS:-20}

    volumes:
      # 本地/NAS 媒体目录挂载。
      # 部署到 NAS 时，把左侧 ./漫画 等改成 NAS 真实路径，例如：
      # - /volume1/media/漫画:/library/comics:ro
      # - /volume1/media/轻小说:/library/novels:ro
      # - /volume1/media/音声:/library/audio:ro
      # - /volume1/media/图库:/library/gallery:ro
      # - /volume1/media/COS图:/library/coser-picture:ro
      - ./漫画:/library/comics:ro
      - ./轻小说:/library/novels:ro
      - ./音声:/library/audio:ro
      - ./图库:/library/gallery:ro
      - ./COS图:/library/coser-picture:ro

      # qmediasync 生成的 STRM 输出目录，只读挂载。
      # 可在 .env 中设置 QMEDIASYNC_STRM_DIR=/volume1/qmediasync/strm
      - ${QMEDIASYNC_STRM_DIR:-./qms-strm}:/qms-strm:ro

      # 应用数据目录：数据库、搜索索引、缩略图、云端缓存等，需要可写并持久化。
      - ./data:/app/data

      # 生成资源目录：封面、占位图等，需要可写并持久化。
      - ./generated:/app/generated

      # 封面缓存目录：按媒体库类型分子目录保存，需要可写并持久化。
      - ./cover-cache:/app/cover-cache

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s

    # 容器异常退出或 NAS 重启后自动恢复。
    restart: unless-stopped
